backend:
  name: github
  repo: sahilosphere/cuvolti
  branch: main
  base_url: https://decap-proxy-production-f192.up.railway.app
  auth_endpoint: /auth

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "src/articles"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "select", options: ["Random Thoughts", "Opinions", "Information", "Life & Observations", "Tech & Trends", "Learnings", "Personal", "Current Affairs"] }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Thumbnail Image", name: "image", widget: "image", required: false, hint: "Optional — na daalo to ek plain placeholder color dikhega." }
      - { label: "Permalink", name: "permalink", widget: "string", required: false, hint: "Jaise: /my-pet/ — shuru aur end mein / zaroor lagao, sirf chhote letters aur hyphen (-) use karo, spaces bilkul mat daalo. Khali chhodoge to title se khud ban jayega.", pattern: ["^\\/[a-z0-9-]+\\/$", "Galat format — aisा likho: /my-pet/"] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "src/about.njk"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Title", name: "title", widget: "hidden", default: "About" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/about/" }
          - { label: "Content (HTML)", name: "body", widget: "markdown" }
